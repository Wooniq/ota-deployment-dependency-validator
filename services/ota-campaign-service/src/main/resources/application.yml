server:
  port: 8083

spring:
  application:
    name: ota-campaign-service

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

ota:
  kafka:
    topics:
      campaign-events: ${OTA_CAMPAIGN_EVENTS_TOPIC:ota-campaign-events}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:ota_campaign_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:sap://${HANA_ADDRESS}:${HANA_PORT}
    driver-class-name: com.sap.db.jdbc.Driver
    username: ${HANA_USER}
    password: ${HANA_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.HANAColumnStoreDialect
        default_schema: ota_campaign
