name: OTA DevOps CI/CD

on:
  push:
    branches: [ main, chore, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  # 1단계: 검증 (Lint + Build)
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Go Build Check (Agent)
        run: go build -v -o /dev/null ./scripts/agent/ecu_collector.go

  # 2단계: 자동 머지 (검증 통과 시)
  automerge:
    needs: test-and-build # 1단계가 성공해야 실행됨
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # PR일 때만 작동
    steps:
      - name: automerge
        uses: "pascalgn/automerge-action@v0.16.2"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERGE_LABELS: "" # 라벨 조건 없이 모든 PR 시도 (위험하면 "automerge" 라벨 지정 가능)
          MERGE_METHOD: "squash" # 커밋을 하나로 합쳐서 메인에 반영