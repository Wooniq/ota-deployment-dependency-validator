# 에이전트 1,000대 배포용 (StatefulSet)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ota-agent
spec:
  serviceName: "ota-agent"
  replicas: 1000
  podManagementPolicy: Parallel

  selector:
    matchLabels:
      app: ota-agent

  template:
    metadata:
      labels:
        app: ota-agent
    spec:
      # [변경] Tolerations를 삭제했습니다. 
      # 이제 마스터 노드의 Taint를 통과하지 못하므로 워커에만 배포됩니다.
      # 1. 마스터 배포 방지 및 워커 타겟팅 강화
      nodeSelector:
        kubernetes.io/role: worker # 노드 라벨이 설정되어 있다면 사용 (K3s 기본값 확인 필요)


      containers:
      - name: ota-agent
        image: ota-agent:v4
        imagePullPolicy: IfNotPresent
        env:
        - name: BROKER_URL
          value: "tcp://192.168.56.1:1883"
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: "2m"      # 총 2 Core 예약
            memory: "8Mi"   # 총 8GB 예약
          limits:
            cpu: 20m
            memory: 16Mi
        volumeMounts:
        - name: inventory-volume
          mountPath: /etc/ota
        - name: agent-data
          mountPath: /var/lib/ota-agent

      volumes:
      - name: inventory-volume
        configMap:
          name: ota-inventory
      - name: agent-data
        emptyDir:
          sizeLimit: 100Mi # 로그나 임시 데이터 저장을 위해 상향

      # 3. 노드 간 균등 분배 강제화
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule # ScheduleAnyway보다 엄격하게 분산 강제
        labelSelector:
          matchLabels:
            app: ota-agent
