apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ota-agent
spec:
  serviceName: "ota-agent"
  replicas: 1000  # 1,000대 가상 차량 생성
  selector:
    matchLabels:
      app: ota-agent
  template:
    metadata:
      labels:
        app: ota-agent
    spec:
      containers:
        - name: ota-agent
          image: docker.io/library/ota-agent:v1
          imagePullPolicy: Never  # 로컬 빌드 이미지만 사용
          resources:
            requests:
              memory: "8Mi"  # 1,000대 수용을 위해 자원 최소화
              cpu: "5m"
            limits:
              memory: "16Mi"
              cpu: "20m"
          env:
            - name: BROKER_URL
              value: "tcp://192.168.56.1:1883"  # 호스트 PC의 MQTT 브로커 주소
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name  # 각 Pod의 고유 이름을 앱에서 VIN으로 사용 가능